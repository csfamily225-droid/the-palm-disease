name: Build Palm Disease APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout project
      # ==================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Java 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ==================================================
      # 3. Setup Flutter
      # ==================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==================================================
      # 4. Regenerate Android project
      # ==================================================
      - name: Regenerate Android folder
        run: |
          rm -rf android
          flutter create . --platforms android --org com.example


      # ==================================================
      # 5. Restore Android permissions
      # ==================================================
      - name: Configure AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <uses-permission
                  android:name="android.permission.READ_MEDIA_IMAGES" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:label="Smart Palm Doctor"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>

          </manifest>
          EOF


      # ==================================================
      # 6. Configure minimum SDK
      # ==================================================
      - name: Configure Minimum SDK
        run: |

          if [ -f android/app/build.gradle.kts ]; then

            sed -i \
              's/minSdk = flutter.minSdkVersion/minSdk = 21/g' \
              android/app/build.gradle.kts

            sed -i \
              's/minSdk = flutter.minSdk.toInt()/minSdk = 21/g' \
              android/app/build.gradle.kts

          fi

          if [ -f android/app/build.gradle ]; then

            sed -i \
              's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' \
              android/app/build.gradle

            sed -i \
              's/minSdkVersion flutter.minSdk/minSdkVersion 21/g' \
              android/app/build.gradle

          fi


      # ==================================================
      # 7. Configure Java 17 + Kotlin 17
      # ==================================================
      - name: Configure JVM Toolchain 17
        run: |

          cat >> android/build.gradle.kts <<'EOF'

          subprojects {

              plugins.withId("java") {

                  extensions.configure<org.gradle.api.plugins.JavaPluginExtension> {

                      toolchain {
                          languageVersion.set(
                              JavaLanguageVersion.of(17)
                          )
                      }
                  }
              }

              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {

                  sourceCompatibility = "17"
                  targetCompatibility = "17"

                  options.release.set(17)
              }

              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile>().configureEach {

                  compilerOptions {

                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }

          EOF


      # ==================================================
      # 8. Add Gradle JVM validation configuration
      # ==================================================
      - name: Configure Gradle Properties
        run: |

          cat >> android/gradle.properties <<'EOF'

          kotlin.jvm.target.validation.mode=error

          EOF


      # ==================================================
      # 9. Configure local.properties
      # ==================================================
      - name: Configure local.properties
        run: |

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties


      # ==================================================
      # 10. Get Flutter packages
      # ==================================================
      - name: Flutter Pub Get
        run: |
          flutter pub get


      # ==================================================
      # 11. Show build configuration
      # ==================================================
      - name: Verify Java and Gradle Configuration
        run: |

          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "JAVA HOME"
          echo "=========================================="

          echo "$JAVA_HOME"

          echo ""
          echo "=========================================="
          echo "MIN SDK"
          echo "=========================================="

          grep -R "minSdk" android/app || true

          echo ""
          echo "=========================================="
          echo "TARGET SDK"
          echo "=========================================="

          grep -R "targetSdk" android/app || true

          echo ""
          echo "=========================================="
          echo "JVM TARGET"
          echo "=========================================="

          grep -R "jvmTarget" android || true

          echo ""
          echo "=========================================="
          echo "JAVA TARGET"
          echo "=========================================="

          grep -R "targetCompatibility" android || true


      # ==================================================
      # 12. Build APK
      # ==================================================
      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons


      # ==================================================
      # 13. Upload APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palm-disease-doctor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
