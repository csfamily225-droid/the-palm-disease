name: Build Palm Disease APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download project source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install Java 17
      # --------------------------------------------------
      - name: Setup Java OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'


      # --------------------------------------------------
      # 3. Install Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true


      # --------------------------------------------------
      # 4. Create a fresh Android folder
      # --------------------------------------------------
      - name: Regenerate fresh Android folder
        run: |
          rm -rf android
          flutter create . --platforms android --org com.example


      # --------------------------------------------------
      # 5. Restore camera and image permissions
      # --------------------------------------------------
      - name: Restore camera permissions in AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <uses-permission
                  android:name="android.permission.READ_MEDIA_IMAGES" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:label="Smart Palm Doctor"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>

          </manifest>
          EOF


      # --------------------------------------------------
      # 6. Set minimum Android SDK for TensorFlow Lite
      # --------------------------------------------------
      - name: Configure Android SDK
        run: |

          if [ -f android/app/build.gradle.kts ]; then

            sed -i \
              's/minSdk = flutter.minSdkVersion/minSdk = 21/g' \
              android/app/build.gradle.kts

            sed -i \
              's/minSdk = flutter.minSdk.toInt()/minSdk = 21/g' \
              android/app/build.gradle.kts

          fi

          if [ -f android/app/build.gradle ]; then

            sed -i \
              's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' \
              android/app/build.gradle

            sed -i \
              's/minSdkVersion flutter.minSdk/minSdkVersion 21/g' \
              android/app/build.gradle

          fi


      # --------------------------------------------------
      # 7. Make Java and Kotlin use JVM 17
      # --------------------------------------------------
      - name: Configure Java and Kotlin JVM 17
        run: |

          cat >> android/build.gradle.kts <<'EOF'

          subprojects {

              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }

          EOF


      # --------------------------------------------------
      # 8. Configure Android local.properties
      # --------------------------------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties


      # --------------------------------------------------
      # 9. Download Flutter dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get


      # --------------------------------------------------
      # 10. Check Java and Android configuration
      # --------------------------------------------------
      - name: Check Build Configuration
        run: |

          echo "======================================"
          echo "JAVA VERSION"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "ANDROID GRADLE FILES"
          echo "======================================"

          find android -name "*.gradle" -o -name "*.gradle.kts"

          echo ""
          echo "======================================"
          echo "JVM CONFIGURATION"
          echo "======================================"

          grep -R "jvmTarget" android || true

          echo ""
          echo "======================================"
          echo "MIN SDK CONFIGURATION"
          echo "======================================"

          grep -R "minSdk" android/app || true

          echo ""
          echo "======================================"
          echo "TARGET SDK CONFIGURATION"
          echo "======================================"

          grep -R "targetSdk" android/app || true


      # --------------------------------------------------
      # 11. Build release APK
      # --------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palm-disease-doctor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
